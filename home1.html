<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artisan & Homemade Products</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #ebebc6;
    color: #3e2723;
}

/* NAVBAR */
nav {
    position: fixed;
    top: 0;
    width: 100%;
    background-color: #3e2723;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.8rem 5%;
    z-index: 1000;
}

/* LOGO IMAGE */
.logo img {
    height: 50px; /* Change this if you want bigger logo */
    width: auto;
    display: block;
}

nav ul {
    list-style: none;
    display: flex;
    gap: 2rem;
}

nav a {
    color: #f5f5dc;
    text-decoration: none;
    font-weight: bold;
}

/* HERO SECTION */
.hero {
    min-height: 100vh;
    display: flex;
    padding-top: 70px;
    padding-bottom: 30px;
}

/* LEFT SIDE */
.hero-content {
    width: 40%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-left: 2%;
}

/* HEADING STRUCTURE */
.main-heading {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 20px;
}

.small-text {
    font-size: 3.8rem;
    font-weight: 700;
}

.big-text {
    font-size: 3.8rem;
    font-weight: 700;
    line-height: 1.05;
    white-space: nowrap;
}

/* PARAGRAPH */
.hero-content p {
    font-size: 1.2rem;
    max-width: 420px;
    margin-bottom: 2rem;
}

.btn {
    background-color: #b37d5c;
    color: white;
    padding: 12px 25px;
    text-decoration: none;
    border-radius: 5px;
    width: fit-content;
}

/* RIGHT SIDE */
.video-container {
    width: 60%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.video-box {
    width: 100%;
    max-width: 800px;
    aspect-ratio: 4 / 3;
    position: relative;
    overflow: hidden;
    border-radius: 20px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.15);
}

.video-box video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* MUTE BUTTON */
.mute-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(0,0,0,0.6);
    color: white;
    border: none;
    font-size: 18px;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
}

/* CONTROLS */
.video-controls {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 30px;
}

.video-controls button {
    background: rgba(0, 0, 0, 0.6);
    color: white;
    border: none;
    font-size: 26px;
    padding: 10px 18px;
    cursor: pointer;
    border-radius: 8px;
}

/* FOOTER */
footer {
    background-color: #3e2723;
    color: white;
    text-align: center;
    padding: 1.5rem;
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .hero {
        flex-direction: column;
        min-height: auto;
    }

    .hero-content,
    .video-container {
        width: 100%;
        padding: 40px 8%;
    }

    .big-text {
        font-size: 2.5rem;
    }

    .video-box {
        max-width: 95%;
    }
}

/* NEW STYLES FOR WHY SECTION */
.why-section {
    padding: 50px 5%;
    text-align: center;
    background-color: #ebebc6;
}

.why-section h2 {
    font-size: 2.5rem;
    margin-bottom: 30px;
    color: #3e2723;
}

.containers {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

.container {
    width: 400px; /* Increased width */
    height: 450px; /* Increased height */
    background-color: #f5f5dc;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    position: relative;
    overflow: hidden;
}

.container:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 16px rgba(0,0,0,0.2);
}

.container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0;
    left: 0;
    transition: opacity 0.3s;
}

.container .default-img {
    filter: blur(1px); /* Blur the default image */
}

.container .hover-img {
    opacity: 0;
}

.container:hover .default-img {
    opacity: 0;
}

.container:hover .hover-img {
    opacity: 1;
}

.container p {
    font-size: 1rem;
    color: #3e2723;
    text-align: center;
    position: relative;
    z-index: 1;
    background: rgba(245, 245, 220, 0.8);
    padding: 5px;
    border-radius: 5px;
}

/* MODAL STYLES */
.modal {
    display: none;
    position: fixed;
    z-index: 2000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
}

.modal-content {
    width: 500px; /* Increased width to accommodate image */
    height: 600px; /* Increased height */
    border-radius: 20px;
    padding: 20px;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    overflow-y: auto; /* In case content overflows */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.close {
    position: absolute;
    top: 10px;
    right: 15px;
    color: #3e2723;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
    background: rgba(255,255,255,0.8);
    border-radius: 50%;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
}

#modal-body {
    text-align: center;
    color: #3e2723;
    width: 100%;
    background: rgba(245, 245, 220, 0.9);
    padding: 15px;
    border-radius: 10px;
    margin-top: auto; /* Push to bottom if needed */
}

#modal-body h3 {
    margin-bottom: 15px;
}

#modal-body p {
    font-size: 1rem;
    line-height: 1.5;
}

/* RESPONSIVE FOR MODAL */
@media (max-width: 768px) {
    .modal-content {
        width: 90%;
        height: auto;
        min-height: 400px;
    }
}
</style>
</head>

<body>

<nav>
    <div class="logo">
        <!-- Replace logo.png with your logo file -->
        <img src="images/logo.png" alt="Logo">
    </div>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

<section class="hero">

    <div class="hero-content">
        <h1 class="main-heading">
            <span class="small-text">Welcome to</span>
            <span class="big-text">Artisan & Homemade</span>
            <span class="big-text">Products</span>
        </h1>

        <p>
            Discover unique, handcrafted goods from skilled artisans around the world.
        </p>

        <a href="#" class="btn">Explore More</a>
    </div>

    <div class="video-container">
        <div class="video-box">
            <!-- Removed loop to enable auto swap -->
            <video id="heroVideo" autoplay muted></video>

            <button id="muteBtn" class="mute-btn">🔇</button>

            <div class="video-controls">
                <button id="prevBtn">&lt;</button>
                <button id="nextBtn">&gt;</button>
            </div>
        </div>
    </div>

</section>

<!-- NEW SECTION: WHY HANDMADE PRODUCTS -->
<section class="why-section">
    <h2>Why Handmade Products</h2>
    <div class="containers">
        <div class="container" id="container1">
            <img src="images/i1.jpg" alt="Unique items" class="default-img">
            <img src="images/i2.jpg" alt="Unique items hover" class="hover-img">
            <p>Unique and personalized items.</p>
        </div>
        <div class="container" id="container2">
            <img src="images/i3.jpg" alt="Support artisans" class="default-img">
            <img src="images/i4.jpg" alt="Support artisans hover" class="hover-img">
            <p>Supports local artisans.</p>
        </div>
        <div class="container" id="container3">
            <img src="images/i5.jpg" alt="Eco-friendly" class="default-img">
            <img src="images/i6.jpg" alt="Eco-friendly hover" class="hover-img">
            <p>Eco-friendly and sustainable.</p>
        </div>
    </div>
</section>

<!-- MODAL FOR EXPANDED CONTENT -->
<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <div id="modal-body">
            <!-- Content will be dynamically inserted here -->
        </div>
    </div>
</div>

<footer>
    Artisan & Homemade Products
</footer>

<script>
const video = document.getElementById("heroVideo");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const muteBtn = document.getElementById("muteBtn");

const videoSources = [
    "video/v5.mp4",
    "video/video2.mp4"
];

let currentVideoIndex = 0;

function setVideo(index) {
    currentVideoIndex = index;
    video.src = videoSources[currentVideoIndex];
    video.play();
}

setVideo(currentVideoIndex);

/* NEXT BUTTON */
nextBtn.addEventListener("click", () => {
    currentVideoIndex = (currentVideoIndex + 1) % videoSources.length;
    setVideo(currentVideoIndex);
});

/* PREVIOUS BUTTON */
prevBtn.addEventListener("click", () => {
    currentVideoIndex = (currentVideoIndex - 1 + videoSources.length) % videoSources.length;
    setVideo(currentVideoIndex);
});

/* AUTO SWAP WHEN VIDEO ENDS */
video.addEventListener("ended", () => {
    currentVideoIndex = (currentVideoIndex + 1) % videoSources.length;
    setVideo(currentVideoIndex);
});

/* MUTE BUTTON */
muteBtn.addEventListener("click", () => {
    video.muted = !video.muted;
    muteBtn.textContent = video.muted ? "🔇" : "🔊";
});

// NEW JAVASCRIPT FOR MODAL FUNCTIONALITY
const modal = document.getElementById("modal");
const modalContent = document.querySelector(".modal-content");
const modalBody = document.getElementById("modal-body");
const closeBtn = document.querySelector(".close");

// Content for each container, now including the background image (default image)
const contentData = {
    container1: {
        bgImage: "images/i1.jpg", // Default image as background
        title: "Unique and Personalized",
        description: "Handmade products are one-of-a-kind, crafted with care to reflect individual styles and preferences. Unlike mass-produced items, each piece tells a story and adds a personal touch to your life."
    },
    container2: {
        bgImage: "images/i3.jpg", // Updated to match HTML default image
        title: "Supports Local Artisans",
        description: "By choosing handmade, you empower skilled artisans and small businesses. Your purchase helps sustain communities, preserves traditional crafts, and promotes fair trade practices."
    },
    container3: {
        bgImage: "images/i5.jpg", // Updated to match HTML default image
        title: "Eco-Friendly and Sustainable",
        description: "Handmade goods often use natural, recycled materials and reduce waste. They contribute to a greener planet by minimizing the environmental impact of factory production and encouraging sustainable practices."
    }
};

// Add click event to each container
document.querySelectorAll('.container').forEach(container => {
    container.addEventListener('click', () => {
        const id = container.id;
        const data = contentData[id];
        modalContent.style.backgroundImage = `url(${data.bgImage})`;
        modalBody.innerHTML = `
            <h3>${data.title}</h3>
            <p>${data.description}</p>
        `;
        modal.style.display = "flex";
    });
});

// Close modal when clicking the close button
closeBtn.addEventListener('click', () => {
    modal.style.display = "none";
    modalContent.style.backgroundImage = ""; // Reset background
});

// Close modal when clicking outside the modal content
window.addEventListener('click', (event) => {
    if (event.target === modal) {
        modal.style.display = "none";
        modalContent.style.backgroundImage = ""; // Reset background
    }
});
</script>

</body>
</html>
